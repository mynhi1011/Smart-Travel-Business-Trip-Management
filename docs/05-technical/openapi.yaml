        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItineraryItemRequest'
      responses:
        '200':
          description: Item đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TripImmutable'

    delete:
      tags: [Itinerary]
      summary: Xóa Itinerary Item
      operationId: deleteItineraryItem
      security:
