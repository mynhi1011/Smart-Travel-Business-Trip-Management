        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

    patch:
      tags: [Expenses]
      summary: Cập nhật justification
      operationId: updateExpense
      security:
        - BearerAuth: []
      description: |
        **Roles:** EMPLOYEE owner. Chỉ `justification` được phép cập nhật.
        Mọi computed field bị strip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                justification:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '200':
          description: Expense đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaim'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  /trips/{tripId}/expense/submit:
    post:
      tags: [Expenses]
      summary: Nộp Expense Claim
      operationId: submitExpense
      security:
        - BearerAuth: []
      description: |
        **Roles:** EMPLOYEE owner. **Điều kiện:** status = DRAFT AND items ≥ 1.
        **BR-TR-05:**
        - 0 < variance ≤ 10% → cần justification
        - variance > 10% → set managerReapprovalRequired = true
      parameters:
        - $ref: '#/components/parameters/tripId'
      responses:
        '200':
          description: Expense đã submit với variance được tính
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaim'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '422':
          description: Cần justification (variance 0–10%) hoặc không có items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: JUSTIFICATION_REQUIRED
                message: "Variance 8.24% > 0. Bắt buộc điền lý do vượt chi (BR-TR-05)."
                requestId: req_abc123

  /trips/{tripId}/expense/approve:
    post:
      tags: [Expenses]
      summary: Finance phê duyệt Expense
      operationId: approveExpense
      security:
        - BearerAuth: []
      description: |
        **Roles:** FINANCE.
        **Điều kiện:** expense.status = SUBMITTED AND (nếu managerReapprovalRequired thì managerReapproved = true).
        Response trả về `tripStatus = EXPENSE_APPROVED` để frontend biết enable nút "Đóng hồ sơ".
      parameters:
        - $ref: '#/components/parameters/tripId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Expense đã được duyệt — trip chuyển sang EXPENSE_APPROVED
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ExpenseStatus'
                  approvedAt:
                    type: string
                    format: date-time
                  tripStatus:
                    $ref: '#/components/schemas/TripStatus'
                    description: Giá trị EXPENSE_APPROVED — frontend dùng để enable nút Close
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '422':
          description: Variance > 10%, Manager chưa re-approve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/expense/reject:
    post:
      tags: [Expenses]
      summary: Finance từ chối Expense
      operationId: rejectExpense
      security:
        - BearerAuth: []
      description: Employee bổ sung items rồi submit lại.
      parameters:
        - $ref: '#/components/parameters/tripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                  minLength: 10
                  maxLength: 1000
      responses:
        '200':
          description: Expense bị từ chối
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ExpenseStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  /trips/{tripId}/expense/reapprove:
    post:
      tags: [Expenses]
      summary: Manager re-approve phần vượt chi
      operationId: reapproveExpense
      security:
        - BearerAuth: []
      description: |
        **Roles:** MANAGER (manager của employee).
        **BR-TR-05:** Chỉ gọi khi managerReapprovalRequired = true.
      parameters:
        - $ref: '#/components/parameters/tripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  $ref: '#/components/schemas/ApprovalAction'
                comment:
                  type: string
                  maxLength: 1000
                  description: Bắt buộc khi action = REJECTED
      responses:
        '200':
          description: Re-approval thực hiện
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  managerReapproved:
                    type: boolean
                  managerReapproverId:
                    type: string
                    format: uuid
                  managerReapprovedAt:
                    type: string
                    format: date-time
                  status:
                    $ref: '#/components/schemas/ExpenseStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

