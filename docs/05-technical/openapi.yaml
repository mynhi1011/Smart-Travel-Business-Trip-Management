  # ── AI ────────────────────────────────────────────────────────
  /ai/generate-itinerary:
    post:
      tags: [AI]
      summary: Tạo Itinerary Draft bằng AI
      operationId: generateItinerary
      security:
        - BearerAuth: []
      description: |
        **Roles:** EMPLOYEE only.
        **BR-TR-07 Guardrail:** Server kiểm tra `totalEstimatedCost ≤ budget` trước khi trả về.
        Nếu AI vượt budget: retry tối đa 2 lần. Vẫn vượt → 422.
        **Timeout:** 8 giây server-side (target ≤ 5s đến client theo NFR-TR-02).
        Gemini API key **không bao giờ** expose ra client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId, destination, days, budget]
              properties:
                tripId:
                  type: string
                  format: uuid
                  description: Validate trip thuộc về user
                destination:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: Đà Nẵng
                days:
                  type: integer
                  minimum: 1
                  maximum: 30
                  example: 3
                budget:
                  type: integer
                  minimum: 1
                  description: VND nguyên — budget cap cho AI
                  example: 5000000
                preferences:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: Ưu tiên họp buổi sáng, tham quan buổi chiều
      responses:
        '200':
          description: Itinerary draft từ AI (guardrail pass)
          content:
            application/json:
              schema:
                type: object
                properties:
                  destination:
                    type: string
                  days:
                    type: integer
                  totalEstimatedCost:
                    type: integer
                    description: Tổng chi phí AI ước tính (VND) — đã pass guardrail ≤ budget
                  budgetCap:
                    type: integer
                  guardrailPass:
                    type: boolean
                    example: true
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        dayNumber:
                          type: integer
                        itemDate:
                          type: string
                          format: date
                        timeSlot:
                          $ref: '#/components/schemas/TimeSlot'
                        location:
                          type: string
                        activity:
                          type: string
                        category:
                          $ref: '#/components/schemas/ItineraryCategory'
                        estimatedCost:
                          type: integer
                        notes:
                          type: string
                          nullable: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: AI không thể sinh itinerary trong budget sau 2 lần retry (BR-TR-07)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: AI_BUDGET_GUARDRAIL_FAILED
                message: Không thể tạo lịch trình trong ngân sách 5.000.000 VNĐ. Vui lòng điều chỉnh ngân sách hoặc số ngày.
                requestId: req_abc123
        '500':
          description: Gemini API timeout hoặc lỗi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Notifications ─────────────────────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: Danh sách notifications
      operationId: listNotifications
      security:
        - BearerAuth: []
      description: Chỉ trả về notifications của user hiện tại.
      parameters:
        - name: isRead
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/pageParam'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Danh sách notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  unreadCount:
                    type: integer
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Đánh dấu tất cả đã đọc
      operationId: markAllNotificationsRead
      security:
        - BearerAuth: []
      description: Route này phải đứng trước `/notifications/{notificationId}/read` trong router để không bị shadow.
      responses:
        '200':
          description: Số notifications đã update
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer
                    example: 5
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Đánh dấu một notification đã đọc
      operationId: markNotificationRead
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        '200':
          description: Notification đã đọc
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  isRead:
                    type: boolean
                    example: true
                  readAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/stream:
    get:
      tags: [Notifications]
      summary: SSE Stream — Real-time notifications
      operationId: notificationStream
      description: |
        **Protocol:** Server-Sent Events (SSE).
        Token gửi qua query param `?token=<accessToken>` vì EventSource API không hỗ trợ custom header.
        Server gửi `ping` event mỗi 30 giây. Client tự reconnect khi mất kết nối.

        **Event format:**
        ```
        event: notification
        data: {"type":"TRIP_APPROVED","tripId":"uuid","message":"...","timestamp":"..."}

        event: ping
        data: {"timestamp":"..."}
        ```
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: JWT Access Token (vì EventSource không support Authorization header)
      responses:
        '200':
          description: SSE stream
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream
            Cache-Control:
              schema:
                type: string
                example: no-cache
            Connection:
              schema:
                type: string
                example: keep-alive
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: notification
                  data: {"type":"TRIP_APPROVED","message":"Chuyến công tác đã được phê duyệt"}
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Dashboard ─────────────────────────────────────────────────
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard stats
      operationId: getDashboard
      security:
        - BearerAuth: []
      description: Response shape khác nhau theo role — filtered server-side.
      responses:
        '200':
          description: Dashboard data theo role
          content:
            application/json:
              schema:
                type: object
                description: Shape khác nhau theo req.user.role
              examples:
                employee:
                  summary: EMPLOYEE view
                  value:
                    role: EMPLOYEE
                    myTrips:
                      total: 8
                      byStatus:
                        DRAFT: 1
                        SUBMITTED: 2
                        APPROVED: 3
                        CLOSED: 2
                      recentTrips: []
                    myExpenses:
                      pendingSubmission: 1
                      pendingApproval: 0
                    notifications:
                      unreadCount: 3
                manager:
                  summary: MANAGER view
                  value:
                    role: MANAGER
                    pendingApprovals:
                      count: 4
                      trips: []
                    teamTrips:
                      total: 23
                      byStatus:
                        APPROVED: 10
                        ONGOING: 3
                        CLOSED: 8
                        REJECTED: 2
                    notifications:
                      unreadCount: 2
                finance:
                  summary: FINANCE view
                  value:
                    role: FINANCE
                    pendingExpenses:
                      count: 6
                      expenses: []
                    pendingClose:
                      count: 2
                      trips: []
                    notifications:
                      unreadCount: 1
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── PDF Export ────────────────────────────────────────────────
  /trips/{tripId}/export-pdf:
    get:
      tags: [PDF Export]
      summary: Xuất Trip Report PDF
      operationId: exportTripPdf
      security:
        - BearerAuth: []
      description: |
        **Roles:** Owner (EMPLOYEE), FINANCE.
        **Điều kiện:** trip.status IN (APPROVED, ONGOING, EXPENSE_SUBMITTED, EXPENSE_APPROVED, CLOSED).
        Nội dung: thông tin nhân viên, lịch trình, bảng đối chiếu ngân sách, lịch sử phê duyệt.
      parameters:
        - $ref: '#/components/parameters/tripId'
      responses:
        '200':
          description: PDF file
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="trip-report-3fa85f64.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'

  # ── Health ────────────────────────────────────────────────────
  /health:
    get:
      tags: [System]
      summary: Health Check
      operationId: healthCheck
      description: Public endpoint — không cần auth.
      responses:
        '200':
          description: Server đang hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: string
                    example: connected

