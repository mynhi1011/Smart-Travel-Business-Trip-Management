        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TripImmutable'

  # ── Expense ───────────────────────────────────────────────────
  /trips/{tripId}/expense:
    parameters:
      - $ref: '#/components/parameters/tripId'

    get:
      tags: [Expenses]
      summary: Chi tiết Expense Claim
      operationId: getExpense
      security:
        - BearerAuth: []
      description: |
        **Roles:** Owner (EMPLOYEE), FINANCE.
        `variancePct`, `varianceAmount`, `totalActual`, `estimatedBudgetSnapshot` là read-only.
      responses:
        '200':
          description: Expense Claim với items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaim'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Expenses]
      summary: Tạo Expense Claim (khởi tạo)
      operationId: createExpense
      security:
        - BearerAuth: []
      description: |
        **Roles:** EMPLOYEE owner.
        **Điều kiện:** trip.status IN (APPROVED, ONGOING) AND chưa có expense.
        Server tự set `estimatedBudgetSnapshot = trip.estimatedBudget`. Không cần request body.
      responses:
        '201':
          description: Expense Claim tạo thành công với status DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseClaim'
        '401':
